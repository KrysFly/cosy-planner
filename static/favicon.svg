<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Cosy Planner">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6f0"/>
      <stop offset="100%" stop-color="#ffe4f0"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb4d0"/>
      <stop offset="100%" stop-color="#e7b6ff"/>
    </linearGradient>
  </defs>

  <!-- Soft shadow -->
  <rect x="3.5" y="5.5" width="25" height="23" rx="5" fill="#e4d4ff" opacity="0.45"/>

  <!-- Calendar body -->
  <rect x="3" y="4" width="25" height="23" rx="5" fill="url(#page)" stroke="#f3b3cb" stroke-width="1.2"/>

  <!-- Header strip -->
  <path d="M3 9.2h25V9a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v.2z" fill="url(#header)"/>

  <!-- Binding rings -->
  <rect x="9.2" y="2.2" width="2.4" height="5.2" rx="1.2" fill="#9ad9c6"/>
  <rect x="20.4" y="2.2" width="2.4" height="5.2" rx="1.2" fill="#9ad9c6"/>
  <rect x="9.5" y="2.5" width="1.8" height="2.2" rx="0.9" fill="#fff6f0" opacity="0.85"/>
  <rect x="20.7" y="2.5" width="1.8" height="2.2" rx="0.9" fill="#fff6f0" opacity="0.85"/>

  <!-- Date grid dots (pastel) -->
  <circle cx="9.5" cy="13.8" r="1.15" fill="#ffd6e5"/>
  <circle cx="15.5" cy="13.8" r="1.15" fill="#e4d4ff"/>
  <circle cx="21.5" cy="13.8" r="1.15" fill="#d4f5e9"/>

  <circle cx="9.5" cy="18.6" r="1.15" fill="#ffe0c7"/>
  <circle cx="15.5" cy="18.6" r="1.35" fill="#e08a9d"/>
  <circle cx="21.5" cy="18.6" r="1.15" fill="#ffd6e5"/>

  <circle cx="9.5" cy="23.2" r="1.15" fill="#e4d4ff"/>
  <circle cx="15.5" cy="23.2" r="1.15" fill="#d4f5e9"/>
  <circle cx="21.5" cy="23.2" r="1.15" fill="#ffe0c7"/>
</svg>
