image: node:22-bookworm

stages:
  - test
  - deploy

smoke:
  stage: test
  script:
    - echo "Runner OK"
    - node -v
    - npm -v
  rules:
    - if: $CI_COMMIT_BRANCH

pages:
  stage: deploy
  script:
    - npm install --no-audit --no-fund
    - npm run build
    - rm -rf public
    - mv dist public
    - test -f public/index.html
    - cp public/index.html public/404.html
    - ls -la public
  pages: true
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "main"
